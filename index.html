
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Tiny World 🍓</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9e9e5;
      font-family: monospace;
      color: #795b63;
    }

    .start-screen {
      width: min(90vw, 430px);
      padding: 48px 24px;
      text-align: center;
      background: #fff8f3;
      border: 4px solid #dba9ad;
      box-shadow: 8px 8px 0 #e9c7c6;
    }

    
.decorations {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 36px;
  margin-bottom: 24px;
  height: 76px;
}

/* 用小方格组成真正的像素图案 */
.pixel-strawberry,
.pixel-bow {
  display: block;
  position: relative;
  width: 8px;
  height: 8px;
  transform: scale(5);
  transform-origin: center;
  image-rendering: pixelated;
}

.pixel-strawberry {
  background: #e96b78;
  box-shadow:
    -8px -24px #62a66e,
    0 -32px #62a66e,
    8px -24px #62a66e,
    -16px -16px #e96b78,
    -8px -16px #e96b78,
    0 -16px #e96b78,
    8px -16px #e96b78,
    16px -16px #e96b78,
    -16px -8px #e96b78,
    -8px -8px #ffd9a4,
    8px -8px #ffd9a4,
    16px -8px #e96b78,
    -8px 0 #e96b78,
    8px 0 #e96b78,
    -8px 8px #e96b78,
    0 8px #ffd9a4,
    8px 8px #e96b78,
    0 16px #e96b78;
}

.pixel-bow {
  background: #f8c2d0;
  box-shadow:
    -24px -16px #e98aa7,
    -16px -16px #e98aa7,
    16px -16px #e98aa7,
    24px -16px #e98aa7,
    -32px -8px #e98aa7,
    -24px -8px #f8c2d0,
    -16px -8px #f8c2d0,
    -8px -8px #e98aa7,
    8px -8px #e98aa7,
    16px -8px #f8c2d0,
    24px -8px #f8c2d0,
    32px -8px #e98aa7,
    -32px 0 #e98aa7,
    -24px 0 #f8c2d0,
    -16px 0 #f8c2d0,
    -8px 0 #e98aa7,
    8px 0 #e98aa7,
    16px 0 #f8c2d0,
    24px 0 #f8c2d0,
    32px 0 #e98aa7,
    -24px 8px #e98aa7,
    -16px 8px #e98aa7,
    -8px 8px #e98aa7,
    8px 8px #e98aa7,
    16px 8px #e98aa7,
    24px 8px #e98aa7,
    -16px 16px #e98aa7,
    16px 16px #e98aa7;
}


    h1 {
      font-size: clamp(25px, 7vw, 36px);
      margin: 12px 0;
      color: #c57c8e;
    }

    .subtitle {
      font-size: 14px;
      margin-bottom: 36px;
    }

    button {
      background: #e7a8b6;
      color: white;
      border: 3px solid #b8798b;
      padding: 14px 38px;
      font: bold 18px monospace;
      cursor: pointer;
      box-shadow: 4px 4px 0 #d7bcc0;
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #d7bcc0;
    }

    #message {
      margin-top: 25px;
      min-height: 24px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="start-screen">
    <div class="decorations">   <span class="pixel-strawberry"></span>   <span class="pixel-bow"></span> </div>
    <h1>Our Tiny World</h1>
    <p class="subtitle">Jiwoo & Haram's Little Home</p>

    <button id="start">START GAME</button>
    <p id="message">♡ A little world, just for us ♡</p>
  </main>

  <script>
    document.getElementById("start").addEventListener("click", () => {
      document.getElementById("message").textContent =
        "Welcome home! ♡";
    });
  </script>
</body>
</html>
