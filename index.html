
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Tiny World</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9eae6;
      font-family: "Courier New", monospace;
      color: #c47790;
      padding: 20px;
    }

    .game-card {
      width: min(100%, 520px);
      background: #fff9f5;
      border: 5px solid #d99cab;
      box-shadow: 9px 9px 0 #edcbd0;
      padding: 48px 22px 38px;
      text-align: center;
    }

    .decorations {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .decorations img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      image-rendering: pixelated;
    }

    h1 {
      font-size: clamp(27px, 6vw, 42px);
      letter-spacing: 1px;
      margin: 0 0 14px;
    }

    .subtitle {
      font-size: 16px;
      color: #84616c;
      margin-bottom: 42px;
    }

    .start-button {
      display: inline-block;
      border: 4px solid #b8758d;
      background: #e8a8ba;
      box-shadow: 5px 5px 0 #eacbd0;
      padding: 16px 30px;
      color: white;
      font-family: inherit;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-button:hover {
      background: #dc91a8;
      transform: translate(2px, 2px);
      box-shadow: 3px 3px 0 #eacbd0;
    }

    .footer {
      margin-top: 42px;
      font-size: 14px;
      color: #896772;
    }

    #game {
      display: none;
      text-align: center;
    }

    #game h2 {
      font-size: 26px;
    }

    @media (max-width: 480px) {
      .game-card {
        padding: 40px 12px 32px;
      }

      .decorations img {
        width: 72px;
        height: 72px;
      }

      .subtitle {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <main class="game-card">

    <section id="welcome">
      <div class="decorations">
        <img src="可爱像素草莓贴纸.png" alt="Pixel strawberry">
        <img src="粉色像素蝴蝶结.png" alt="Pixel pink bow">
      </div>

      <h1>Our Tiny World</h1>
      <p class="subtitle">Jiwoo & Haram's Little Home</p>

      <button class="start-button" onclick="startGame()">
        ♡ START GAME ♡
      </button>

      <p class="footer">
        ♡ A little world, just for us ♡
      </p>
    </section>

    <section id="game">
      <h2>♡ Welcome Home ♡</h2>
      <p>Jiwoo & Haram's little world is waiting...</p>
    </section>

  </main>

  <script>
    function startGame() {
      document.getElementById("welcome").style.display = "none";
      document.getElementById("game").style.display = "block";
    }
  </script>
</body>
</html>
