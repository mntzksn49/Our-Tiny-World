
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Tiny World · Home</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7e8e6;
  font-family: "Courier New", monospace;
  color: #76535c;
  text-align: center;
  padding: 22px 12px 45px;
}

h1 {
  margin: 0 0 5px;
  font-size: 32px;
  color: #bd788e;
}

.subtitle {
  margin: 0 0 25px;
  font-size: 14px;
}

.game {
  width: min(96vw, 1100px);
  margin: auto;
  padding: 14px;
  background: #b98c80;
  border: 7px solid #825c59;
  box-shadow: 9px 9px 0 #d8b7b2;
  overflow-x: auto;
}

.house {
  position: relative;
  width: 100%;
  aspect-ratio: 1000 / 720;
  min-width: 620px;
  background: #825c59;
  overflow: hidden;
}

/* 四个不同大小的房间 */

.room {
  position: absolute;
  overflow: hidden;
  border: 6px solid #825c59;
}

.bedroom {
  left: 0;
  top: 0;
  width: 65%;
  height: 43%;
  background: repeating-linear-gradient(
    90deg,
    #e9bb9e 0 27px,
    #dca98d 27px 30px
  );
}

.kitchen {
  left: 65%;
  top: 0;
  width: 35%;
  height: 60%;
  background: conic-gradient(
    #f4dcd0 25%,
    #fff0e5 0 50%,
    #f4dcd0 0 75%,
    #fff0e5 0
  ) 0 0 / 48px 48px;
}

.living {
  left: 0;
  top: 43%;
  width: 65%;
  height: 57%;
  background: repeating-linear-gradient(
    0deg,
    #d7b48e 0 30px,
    #c49d78 30px 33px
  );
}

.bathroom {
  left: 65%;
  top: 60%;
  width: 35%;
  height: 40%;
  background: conic-gradient(
    #c3dfd9 25%,
    #e7f5ef 0 50%,
    #c3dfd9 0 75%,
    #e7f5ef 0
  ) 0 0 / 42px 42px;
}

/* 让客厅向厨房下方延伸，形成不规则结构 */
.living-extension {
  position: absolute;
  left: 65%;
  top: 60%;
  width: 10%;
  height: 40%;
  background: repeating-linear-gradient(
    0deg,
    #d7b48e 0 30px,
    #c49d78 30px 33px
  );
  border: 6px solid #825c59;
  border-left: 0;
  z-index: 2;
}

/* 卫生间相应缩小 */
.bathroom {
  left: 75%;
  width: 25%;
}

/* 房间标签 */

.room-name {
  position: absolute;
  left: 12px;
  top: 10px;
  z-index: 10;
  padding: 7px 10px;
  background: #fff0e8;
  border: 3px solid #aa8583;
  font-size: 13px;
  white-space: nowrap;
}

/* 家具通用像素样式 */

.pixel {
  position: absolute;
  border: 5px solid #9b7068;
  box-shadow: 6px 6px 0 #785550;
}

/* 卧室 */

.window {
  left: 6%;
  top: 25%;
  width: 17%;
  height: 25%;
  background:
    linear-gradient(90deg,transparent 46%,#fff3e8 46% 54%,transparent 54%),
    linear-gradient(transparent 46%,#fff3e8 46% 54%,transparent 54%),
    #a8dbe0;
}

.bed {
  left: 36%;
  top: 18%;
  width: 29%;
  height: 70%;
  background: #eeb4c5;
}

.bed::before {
  content: "";
  position: absolute;
  left: 5%;
  top: 5%;
  width: 90%;
  height: 25%;
  background:
    linear-gradient(90deg,#fff8f0 0 47%,#e4bfc9 47% 53%,#fff8f0 53%);
  border: 4px solid #dfafbd;
}

.bed::after {
  content: "";
  position: absolute;
  left: -10%;
  bottom: -3%;
  width: 120%;
  height: 34%;
  background: #f7dce0;
  border: 8px solid #efb6c9;
}

.wardrobe {
  right: 4%;
  bottom: 7%;
  width: 17%;
  height: 39%;
  background:
    linear-gradient(90deg,transparent 48%,#815a55 48% 52%,transparent 52%),
    #bb8b73;
}

.wardrobe::after {
  content: "▪   ▪";
  position: absolute;
  left: 20%;
  top: 40%;
  color: #ffe1aa;
  font-size: 18px;
}

.bedside {
  left: 5%;
  bottom: 9%;
  width: 13%;
  height: 17%;
  background: #bd8d74;
}

.bedside::after {
  content: "";
  position: absolute;
  inset: 25%;
  border: 3px solid #9b7068;
  background: #e5b89a;
}

/* 厨房 */

.counter {
  top: 20%;
  left: 16%;
  width: 78%;
  height: 22%;
  background: #e8bba4;
}

.counter::before {
  content: "";
  position: absolute;
  left: 5%;
  top: 15%;
  width: 26%;
  height: 34%;
  background:
    linear-gradient(90deg,#77727b 0 42%,#e9d8d6 42% 58%,#77727b 58%);
  border: 4px solid #f8e8e1;
}

.counter::after {
  content: "";
  position: absolute;
  left: 5%;
  bottom: 7%;
  width: 90%;
  height: 27%;
  background: repeating-linear-gradient(
    90deg,
    #f6d7c4 0 30%,
    #ad8178 30% 32%
  );
  border: 3px solid #ad8178;
}

.fridge {
  left: 8%;
  bottom: 9%;
  width: 24%;
  height: 39%;
  background: linear-gradient(
    #f5dce6 0 49%,
    #ae7f90 49% 52%,
    #e7b6ca 52%
  );
  z-index: 4;
}

.fridge::after {
  content: "";
  position: absolute;
  right: 15%;
  top: 20%;
  width: 6px;
  height: 17%;
  background: #fff5eb;
  box-shadow: 0 65px 0 #fff5eb;
}

.dining-table {
  right: 8%;
  bottom: 9%;
  width: 42%;
  height: 26%;
  background: #d6a587;
}

.dining-table::before,
.dining-table::after {
  content: "";
  position: absolute;
  top: 25%;
  width: 15%;
  height: 50%;
  background: #e6c3a8;
  border: 4px solid #9b7068;
}

.dining-table::before {
  left: -23%;
}

.dining-table::after {
  right: -23%;
}

.strawberry {
  position: absolute;
  left: 43%;
  top: 38%;
  width: 20px;
  height: 20px;
  background: #e36e88;
  border-top: 5px solid #69a56e;
}

/* 客厅 */

.sofa {
  left: 30%;
  top: 16%;
  width: 36%;
  height: 27%;
  background: #e6a9be;
}

.sofa::before {
  content: "";
  position: absolute;
  left: 5%;
  bottom: 8%;
  width: 90%;
  height: 37%;
  background:
    linear-gradient(90deg,#f6d2dd 0 48%,#d39caf 48% 52%,#f6d2dd 52%);
  border: 4px solid #ba839a;
}

.rug {
  position: absolute;
  left: 26%;
  top: 43%;
  width: 44%;
  height: 36%;
  background: #f7ded7;
  border: 9px solid #efb6c9;
}

.coffee-table {
  left: 40%;
  top: 52%;
  width: 20%;
  height: 15%;
  background: #c9957c;
}

.coffee-table::after {
  content: "♡";
  position: absolute;
  left: 43%;
  top: 15%;
  color: #ef8da7;
  font-size: 22px;
}

.tv {
  left: 39%;
  bottom: 5%;
  width: 23%;
  height: 17%;
  background: #bb8a73;
}

.tv::before {
  content: "";
  position: absolute;
  left: 16%;
  top: -48%;
  width: 68%;
  height: 75%;
  background: #a7d4d8;
  border: 7px solid #78677c;
}

.picture {
  right: 6%;
  top: 15%;
  width: 13%;
  height: 17%;
  background: #f5ceda;
  display: grid;
  place-items: center;
  color: #d77c9d;
  font-size: 24px;
}

/* 卫生间 */

.bathtub {
  right: 5%;
  top: 24%;
  width: 54%;
  height: 30%;
  background: #f8fbf8;
}

.bathtub::after {
  content: "";
  position: absolute;
  inset: 12%;
  background: #bce3e5;
  border: 5px solid #e3f5f5;
}

.sink {
  left: 7%;
  bottom: 17%;
  width: 42%;
  height: 22%;
  background: #e8b4c7;
}

.sink::after {
  content: "";
  position: absolute;
  inset: 18%;
  background: #e9faf7;
  border: 4px solid #f9e7e8;
}

.mirror {
  left: 10%;
  top: 20%;
  width: 33%;
  height: 28%;
  background: #b6e5e9;
}

.basket {
  right: 7%;
  bottom: 8%;
  width: 29%;
  height: 23%;
  background: repeating-linear-gradient(
    90deg,
    #c68d6e 0 15px,
    #dfac89 15px 20px
  );
}

/* 墙壁边缘 */

.house::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 7px solid #825c59;
  pointer-events: none;
  z-index: 20;
}

@media(max-width:650px) {
  h1 {
    font-size: 25px;
  }

  .game {
    padding: 7px;
  }

  .room-name {
    font-size: 11px;
    padding: 4px 5px;
  }
}
/* ===== Our Tiny World · Grid Layout V3 ===== */

/* 整个房屋网格 */
.house {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-template-rows: repeat(10, 1fr);
  gap: 0;
  position: relative;
  width: 100%;
  aspect-ratio: 1000 / 720;
  min-width: 620px;
  background: #825c59;
  overflow: hidden;
}

/* 房间统一恢复正常布局 */
.room {
  position: relative;
  left: auto;
  top: auto;
  width: auto;
  height: auto;
  min-height: 0;
  clip-path: none;
  border: 5px solid #825c59;
  overflow: hidden;
}

/* 卧室：左上 */
.bedroom {
  grid-column: 1 / 8;
  grid-row: 1 / 5;
}

/* 厨房：右上，面积比卧室小 */
.kitchen {
  grid-column: 8 / 13;
  grid-row: 1 / 7;
}

/* 客厅：左下，面积最大 */
.living {
  grid-column: 1 / 8;
  grid-row: 5 / 11;
}

/* 卫生间：右下，面积最小 */
.bathroom {
  grid-column: 9 / 13;
  grid-row: 7 / 11;
}

/* 客厅右侧向外延伸一格 */
.living-extension {
  display: block;
  position: relative;
  left: auto;
  top: auto;
  width: auto;
  height: auto;
  grid-column: 8 / 9;
  grid-row: 7 / 11;
  border: 5px solid #825c59;
  border-left: 0;
  background: repeating-linear-gradient(
    0deg,
    #d7b48e 0 30px,
    #c49d78 30px 33px
  );
  z-index: 1;
}

/* 厨房家具保持在厨房内部 */
.kitchen .fridge {
  z-index: 3;
}

/* 所有家具仍保持原来的位置和样式 */
.pixel {
  position: absolute;
}
  /* 客厅延伸区域与主客厅连通 */
.living-extension {
  border-left: none;
  border-top: none;
}

/* 去掉主客厅右下方的分隔墙 */
.living {
  border-right: none;
}

/* 保留客厅与厨房之间的墙 */
.kitchen {
  border-left: 5px solid #825c59;
}
</style>
</head>

<body>

<h1>Our Tiny World</h1>
<p class="subtitle">♡ Jiwoo & Haram's Little Home ♡</p>

<div class="game">
  <div class="house">

    <!-- 卧室 -->
    <section class="room bedroom">
      <span class="room-name">🥛 BEDROOM</span>

      <div class="pixel window"></div>
      <div class="pixel bed"></div>
      <div class="pixel wardrobe"></div>
      <div class="pixel bedside"></div>
    </section>

    <!-- 厨房 -->
    <section class="room kitchen">
      <span class="room-name">🥛 KITCHEN</span>

      <div class="pixel counter"></div>
      <div class="pixel fridge"></div>
      <div class="pixel dining-table">
        <div class="strawberry"></div>
      </div>
    </section>

    <!-- 客厅 -->
    <section class="room living">
      <span class="room-name">🥛 LIVING ROOM</span>

      <div class="rug"></div>
      <div class="pixel sofa"></div>
      <div class="pixel coffee-table"></div>
      <div class="pixel tv"></div>
      <div class="pixel picture">♡ ♡</div>
    </section>

    <!-- 客厅延伸区域 -->
    <div class="living-extension"></div>

    <!-- 卫生间 -->
    <section class="room bathroom">
      <span class="room-name">🫧 BATHROOM</span>

      <div class="pixel mirror"></div>
      <div class="pixel sink"></div>
      <div class="pixel bathtub"></div>
      <div class="pixel basket"></div>
    </section>

  </div>
</div>

</body>
</html>
