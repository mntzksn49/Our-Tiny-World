
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Tiny World · Home</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7e8e6;
  font-family: "Courier New", monospace;
  color: #76535c;
  text-align: center;
  padding: 24px 12px 45px;
}

h1 {
  margin: 0 0 5px;
  font-size: clamp(25px, 4vw, 36px);
  color: #bd788e;
}

.subtitle {
  margin: 0 0 23px;
  font-size: 14px;
}

.viewport {
  width: min(97vw, 1150px);
  margin: auto;
  overflow-x: auto;
  padding: 12px 12px 18px;
}

.house {
  position: relative;
  width: 1050px;
  height: 790px;
  margin: auto;
  text-align: left;
}

/* ===== 房间基础 ===== */

.room {
  position: absolute;
  overflow: hidden;
  border: 7px solid #825c59;
  box-shadow: 6px 6px 0 #d8b7b2;
}

/* ===== 不规则房屋布局 ===== */

.bedroom {
  left: 110px;
  top: 0;
  width: 555px;
  height: 300px;
  background: repeating-linear-gradient(
    90deg,
    #e9bb9e 0 27px,
    #dca98d 27px 30px
  );
}

.kitchen {
  left: 665px;
  top: 40px;
  width: 365px;
  height: 430px;
  background: conic-gradient(
    #f4dcd0 25%,
    #fff0e5 0 50%,
    #f4dcd0 0 75%,
    #fff0e5 0
  ) 0 0 / 46px 46px;
}

.living {
  left: 20px;
  top: 300px;
  width: 645px;
  height: 420px;
  background: repeating-linear-gradient(
    0deg,
    #d7b48e 0 30px,
    #c49d78 30px 33px
  );
}

.bathroom {
  left: 665px;
  top: 470px;
  width: 295px;
  height: 250px;
  background: conic-gradient(
    #c3dfd9 25%,
    #e7f5ef 0 50%,
    #c3dfd9 0 75%,
    #e7f5ef 0
  ) 0 0 / 42px 42px;
}

.entry {
  left: 310px;
  top: 720px;
  width: 230px;
  height: 70px;
  background: repeating-linear-gradient(
    90deg,
    #d7b48e 0 25px,
    #c49d78 25px 28px
  );
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9c6d72;
  font-size: 16px;
  letter-spacing: 2px;
}

/* ===== 房间名称 ===== */

.room-name {
  position: absolute;
  left: 11px;
  top: 10px;
  z-index: 10;
  background: #fff0e8;
  border: 3px solid #aa8583;
  padding: 6px 9px;
  font-size: 13px;
  white-space: nowrap;
}

/* ===== 像素家具基础 ===== */

.pixel {
  position: absolute;
  border: 5px solid #9b7068;
  box-shadow: 6px 6px 0 #785550;
}

/* =========================
   BEDROOM 卧室
========================= */

.window {
  left: 6%;
  top: 25%;
  width: 105px;
  height: 85px;
  background:
    linear-gradient(
      90deg,
      transparent 46%,
      #fff3e8 46% 54%,
      transparent 54%
    ),
    linear-gradient(
      transparent 46%,
      #fff3e8 46% 54%,
      transparent 54%
    ),
    #a8dbe0;
}

.bed {
  left: 35%;
  top: 43px;
  width: 160px;
  height: 210px;
  background: #eeb4c5;
}

.bed::before {
  content: "";
  position: absolute;
  left: 5%;
  top: 5%;
  width: 90%;
  height: 25%;
  background: linear-gradient(
    90deg,
    #fff8f0 0 47%,
    #e4bfc9 47% 53%,
    #fff8f0 53%
  );
  border: 4px solid #dfafbd;
}

.bed::after {
  content: "";
  position: absolute;
  left: -12%;
  bottom: -3%;
  width: 124%;
  height: 36%;
  background: #f7dce0;
  border: 8px solid #efb6c9;
}

.wardrobe {
  right: 25px;
  bottom: 20px;
  width: 95px;
  height: 120px;
  background:
    linear-gradient(
      90deg,
      transparent 48%,
      #815a55 48% 52%,
      transparent 52%
    ),
    #bb8b73;
}

.wardrobe::after {
  content: "▪   ▪";
  position: absolute;
  left: 20%;
  top: 40%;
  color: #ffe1aa;
  font-size: 18px;
}

.bedside {
  left: 25px;
  bottom: 22px;
  width: 75px;
  height: 60px;
  background: #bd8d74;
}

.bedside::after {
  content: "";
  position: absolute;
  inset: 25%;
  border: 3px solid #9b7068;
  background: #e5b89a;
}

/* =========================
   KITCHEN 厨房
========================= */

.counter {
  top: 68px;
  right: 20px;
  width: 270px;
  height: 96px;
  background: #e8bba4;
}

.counter::before {
  content: "";
  position: absolute;
  left: 14px;
  top: 12px;
  width: 75px;
  height: 29px;
  background: linear-gradient(
    90deg,
    #77727b 0 42%,
    #e9d8d6 42% 58%,
    #77727b 58%
  );
  border: 4px solid #f8e8e1;
}

.counter::after {
  content: "";
  position: absolute;
  left: 12px;
  bottom: 8px;
  width: 235px;
  height: 28px;
  background: repeating-linear-gradient(
    90deg,
    #f6d7c4 0 30%,
    #ad8178 30% 32%
  );
  border: 3px solid #ad8178;
}

.fridge {
  left: 20px;
  bottom: 30px;
  width: 90px;
  height: 150px;
  background: linear-gradient(
    #f5dce6 0 49%,
    #ae7f90 49% 52%,
    #e7b6ca 52%
  );
}

.fridge::after {
  content: "";
  position: absolute;
  right: 13px;
  top: 28px;
  width: 6px;
  height: 25px;
  background: #fff5eb;
  box-shadow: 0 78px 0 #fff5eb;
}

.dining-table {
  right: 32px;
  bottom: 40px;
  width: 135px;
  height: 105px;
  background: #d6a587;
}

.dining-table::before,
.dining-table::after {
  content: "";
  position: absolute;
  top: 27px;
  width: 20px;
  height: 45px;
  background: #e6c3a8;
  border: 4px solid #9b7068;
}

.dining-table::before {
  left: -28px;
}

.dining-table::after {
  right: -28px;
}

.strawberry {
  position: absolute;
  left: 50px;
  top: 32px;
  width: 22px;
  height: 22px;
  background: #e36e88;
  border-top: 5px solid #69a56e;
}

/* =========================
   LIVING ROOM 客厅
========================= */

.sofa {
  left: 185px;
  top: 72px;
  width: 240px;
  height: 125px;
  background: #e6a9be;
}

.sofa::before {
  content: "";
  position: absolute;
  left: 10px;
  bottom: 10px;
  width: 210px;
  height: 48px;
  background: linear-gradient(
    90deg,
    #f6d2dd 0 48%,
    #d39caf 48% 52%,
    #f6d2dd 52%
  );
  border: 4px solid #ba839a;
}

.rug {
  position: absolute;
  left: 155px;
  top: 200px;
  width: 310px;
  height: 155px;
  background: #f7ded7;
  border: 9px solid #efb6c9;
}

.coffee-table {
  left: 245px;
  top: 230px;
  width: 130px;
  height: 75px;
  background: #c9957c;
}

.coffee-table::after {
  content: "♡";
  position: absolute;
  left: 45%;
  top: 17%;
  color: #ef8da7;
  font-size: 24px;
}

.tv {
  left: 265px;
  bottom: 16px;
  width: 120px;
  height: 60px;
  background: #bb8a73;
}

.tv::before {
  content: "";
  position: absolute;
  left: 17px;
  top: -42px;
  width: 75px;
  height: 55px;
  background: #a7d4d8;
  border: 7px solid #78677c;
}

.picture {
  right: 32px;
  top: 50px;
  width: 82px;
  height: 70px;
  background: #f5ceda;
  display: grid;
  place-items: center;
  color: #d77c9d;
  font-size: 23px;
}

/* =========================
   BATHROOM 卫生间
========================= */

.bathtub {
  right: 14px;
  top: 65px;
  width: 140px;
  height: 95px;
  background: #f8fbf8;
}

.bathtub::after {
  content: "";
  position: absolute;
  inset: 12%;
  background: #bce3e5;
  border: 5px solid #e3f5f5;
}

.sink {
  left: 17px;
  bottom: 18px;
  width: 115px;
  height: 65px;
  background: #e8b4c7;
}

.sink::after {
  content: "";
  position: absolute;
  inset: 18%;
  background: #e9faf7;
  border: 4px solid #f9e7e8;
}

.mirror {
  left: 23px;
  top: 65px;
  width: 85px;
  height: 85px;
  background: #b6e5e9;
}

.basket {
  right: 20px;
  bottom: 16px;
  width: 78px;
  height: 60px;
  background: repeating-linear-gradient(
    90deg,
    #c68d6e 0 15px,
    #dfac89 15px 20px
  );
}

/* =========================
   房间连接与像素门口
========================= */

.door {
  position: absolute;
  z-index: 20;
  border: none;
  box-shadow: none;
}

/* 卧室通向客厅 */
.door-bedroom {
  left: 285px;
  top: 293px;
  width: 90px;
  height: 14px;
  background: repeating-linear-gradient(
    90deg,
    #d7b48e 0 20px,
    #c49d78 20px 22px
  );
}

/* 客厅通向厨房 */
.door-kitchen {
  left: 658px;
  top: 345px;
  width: 14px;
  height: 90px;
  background: repeating-linear-gradient(
    0deg,
    #f4dcd0 0 23px,
    #fff0e5 23px 46px
  );
}

/* 卫生间入口 */
.door-bath {
  left: 658px;
  top: 580px;
  width: 14px;
  height: 70px;
  background: repeating-linear-gradient(
    0deg,
    #c3dfd9 0 21px,
    #e7f5ef 21px 42px
  );
}

/* 玄关地垫 */
.entry-mat {
  position: absolute;
  bottom: 7px;
  left: 62px;
  width: 95px;
  height: 25px;
  background: #efb6c9;
  border: 3px solid #c58b98;
}

/* 客厅连接玄关 */
.door-entry {
  left: 370px;
  top: 713px;
  width: 110px;
  height: 14px;
  background: repeating-linear-gradient(
    90deg,
    #d7b48e 0 25px,
    #c49d78 25px 28px
  );
}

/* ===== 小屏幕横向滚动 ===== */

@media (max-width: 1100px) {
  .house {
    margin-left: 0;
    margin-right: 0;
  }
}
  /* 床铺点击互动 */
.bed {
  cursor: pointer;
}

.bed:hover {
  filter: brightness(1.06);
}

/* 像素风弹窗 */
.memory-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(65, 42, 49, 0.55);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.memory-window {
  position: relative;
  width: min(90vw, 420px);
  background: #fff7f3;
  border: 5px solid #b87c91;
  box-shadow: 8px 8px 0 #e5bac7;
  padding: 38px 24px 30px;
  text-align: center;
  color: #865e6c;
}

.memory-window h2 {
  margin: 0 0 22px;
  color: #c47790;
  font-size: 23px;
}

.memory-window p {
  font-size: 15px;
  line-height: 2;
  margin: 12px 0;
}

.memory-close {
  position: absolute;
  right: 10px;
  top: 6px;
  background: none;
  border: none;
  color: #b87c91;
  font-size: 26px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>Our Tiny World</h1>

<p class="subtitle">
  ♡ Jiwoo &amp; Haram's Little Home ♡
</p>

<div class="viewport">
  <main class="house">

    <!-- ===== 卧室 ===== -->
    <section class="room bedroom">
      <span class="room-name">🥛 BEDROOM</span>

      <div class="pixel window"></div>
      <div class="pixel bed" onclick="openBedMemory()" title="Click to explore ♡"></div>
      <div class="pixel wardrobe"></div>
      <div class="pixel bedside"></div>
    </section>

    <!-- ===== 厨房 ===== -->
    <section class="room kitchen">
      <span class="room-name">🥛 KITCHEN</span>

      <div class="pixel counter"></div>
      <div class="pixel fridge"></div>

      <div class="pixel dining-table">
        <div class="strawberry"></div>
      </div>
    </section>

    <!-- ===== 客厅 ===== -->
    <section class="room living">
      <span class="room-name">🥛 LIVING ROOM</span>

      <div class="rug"></div>
      <div class="pixel sofa"></div>
      <div class="pixel coffee-table"></div>
      <div class="pixel tv"></div>
      <div class="pixel picture">♡ ♡</div>
    </section>

    <!-- ===== 卫生间 ===== -->
    <section class="room bathroom">
      <span class="room-name">🫧 BATHROOM</span>

      <div class="pixel mirror"></div>
      <div class="pixel sink"></div>
      <div class="pixel bathtub"></div>
      <div class="pixel basket"></div>
    </section>

    <!-- ===== 玄关 ===== -->
    <section class="room entry">
      <span>♡ ENTRY ♡</span>
      <div class="entry-mat"></div>
    </section>

    <!-- ===== 房间连接 ===== -->
    <div class="door door-bedroom"></div>
    <div class="door door-kitchen"></div>
    <div class="door door-bath"></div>
    <div class="door door-entry"></div>

  </main>
</div>
<!-- 卧室床铺互动弹窗 -->
<div class="memory-overlay" id="bedMemory" onclick="closeBedMemory()">
  <div class="memory-window" onclick="event.stopPropagation()">
    <button class="memory-close" onclick="closeBedMemory()">×</button>

    <h2>♡ Sweet Dreams ♡</h2>

    <p>🥛 Jiwoo: 姐姐，还不睡吗？</p>
    <p>🍓 Haram: 再陪我一会儿嘛。</p>
    <p>🥛 Jiwoo: 好，那我陪你。</p>

    <p>♡ Good night, my love ♡</p>
  </div>
</div>

<script>
function openBedMemory() {
  document.getElementById("bedMemory").style.display = "flex";
}

function closeBedMemory() {
  document.getElementById("bedMemory").style.display = "none";
}
</script>
</body>
</html>
