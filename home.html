
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Tiny World · Home</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f7e8e6;
  font-family:monospace;
  color:#76535c;
  text-align:center;
}
h1{margin:28px 0 6px;color:#bd788e}
p{margin:0 0 20px;font-size:13px}
.game{
  width:min(96vw,850px);
  margin:auto;
  padding:12px;
  background:#b98c80;
  border:6px solid #825c59;
  box-shadow:8px 8px 0 #d8b7b2;
}
.house{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  background:#825c59;
}
.room{
  min-height:245px;
  padding:12px;
  position:relative;
  overflow:hidden;
  border:5px solid #9d726a;
  image-rendering:pixelated;
}
.bedroom{
  background:repeating-linear-gradient(
    90deg,#e9bb9e 0 24px,#dca98d 24px 26px);
}
.kitchen{
  background:conic-gradient(
    #f4dcd0 25%,#fff0e5 0 50%,
    #f4dcd0 0 75%,#fff0e5 0) 0 0/44px 44px;
}
.living{
  background:repeating-linear-gradient(
    0deg,#d7b48e 0 25px,#c49d78 25px 27px);
}
.bathroom{
  background:conic-gradient(
    #c3dfd9 25%,#e7f5ef 0 50%,
    #c3dfd9 0 75%,#e7f5ef 0) 0 0/40px 40px;
}
.room-name{
  position:absolute;
  left:9px;top:8px;
  background:#fff0e8;
  padding:5px 8px;
  border:2px solid #aa8583;
  font-size:12px;
  z-index:2;
}
.furniture{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  border:4px solid #a77a72;
  box-shadow:5px 5px 0 #8d625b;
}
.bed{
  width:115px;height:145px;
  left:50%;top:48px;
  transform:translateX(-50%);
  background:linear-gradient(#fff4e9 0 25%,#efb6c3 25%);
}
.wardrobe{
  width:65px;height:85px;
  right:13px;bottom:14px;
  background:#b98465;
}
.desk{
  width:90px;height:52px;
  left:13px;bottom:17px;
  background:#edc3b2;
}
.counter{
  width:75%;height:53px;
  top:15px;right:10px;
  background:#f5d7c4;
}
.fridge{
  width:67px;height:90px;
  left:14px;bottom:17px;
  background:#f9e4e8;
}
.table{
  width:100px;height:85px;
  right:25px;bottom:25px;
  background:#e6b48f;
}
.sofa{
  width:150px;height:70px;
  left:50%;top:43px;
  transform:translateX(-50%);
  background:#e5a9bc;
}
.tv{
  width:105px;height:45px;
  left:50%;bottom:25px;
  transform:translateX(-50%);
  background:#78677c;
}
.rug{
  position:absolute;
  width:155px;height:90px;
  left:50%;top:115px;
  transform:translateX(-50%);
  background:#f6d9cb;
  border:6px solid #eab7bb;
}
.bath{
  width:125px;height:90px;
  top:48px;right:18px;
  background:#f5faf7;
}
.sink{
  width:72px;height:62px;
  bottom:30px;left:20px;
  background:#f9e5e4;
}
.laundry{
  width:75px;height:75px;
  right:25px;bottom:25px;
  background:#e9eef2;
}
@media(max-width:560px){
  .game{padding:6px;border-width:4px}
  .room{min-height:190px;padding:5px;border-width:3px}
  .furniture{font-size:23px;zoom:.7}
  .room-name{font-size:10px}
}
  /* ===== PIXEL BEDROOM ===== */

.bedroom {
  background:
    repeating-linear-gradient(
      90deg,
      #e9bc9e 0 30px,
      #d8a78c 30px 32px
    );
}

/* 窗户 */
.pixel-window {
  position: absolute;
  width: 76px;
  height: 62px;
  top: 45px;
  left: 20px;
  background: #f9e8d9;
  border: 6px solid #a77b71;
  box-shadow: 4px 4px 0 #805d5b;
}

.window-glass {
  width: 100%;
  height: 100%;
  background:
    linear-gradient(
      90deg,
      transparent 46%,
      #fff2e8 46% 54%,
      transparent 54%
    ),
    linear-gradient(
      0deg,
      transparent 45%,
      #fff2e8 45% 55%,
      transparent 55%
    ),
    #a9d9df;
}

/* 双人床 */
.pixel-bed {
  position: absolute;
  width: 130px;
  height: 150px;
  left: 50%;
  top: 45px;
  transform: translateX(-50%);
  background: #f6d3d9;
  border: 6px solid #9b6b68;
  box-shadow: 5px 5px 0 #795451;
}

.bed-headboard {
  position: absolute;
  height: 16px;
  left: -4px;
  right: -4px;
  top: -9px;
  background: #bd8875;
  border: 4px solid #865e58;
}

.bed-pillows {
  display: flex;
  gap: 5px;
  padding: 14px 7px 0;
}

.bed-pillows span {
  display: block;
  width: 50%;
  height: 30px;
  background: #fff9ee;
  border: 3px solid #e7bdc5;
}

.bed-blanket {
  position: absolute;
  left: 5px;
  right: 5px;
  top: 57px;
  bottom: 9px;
  background:
    repeating-linear-gradient(
      90deg,
      #efafbf 0 12px,
      #e6a0b3 12px 15px
    );
  border-top: 7px solid #fff2e9;
}

.bed-footboard {
  position: absolute;
  bottom: -5px;
  left: -4px;
  right: -4px;
  height: 12px;
  background: #bd8875;
  border: 3px solid #865e58;
}

/* 地毯 */
.pixel-rug {
  position: absolute;
  width: 160px;
  height: 72px;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  background: #f5d8d8;
  border: 7px solid #e6aab8;
  box-shadow: inset 0 0 0 5px #fff0e5;
}

/* 床头柜 */
.pixel-nightstand {
  position: absolute;
  width: 52px;
  height: 46px;
  left: 17px;
  bottom: 24px;
  background: #c58f75;
  border: 5px solid #90665d;
  box-shadow: 4px 4px 0 #78534e;
}

.nightstand-drawer {
  width: 32px;
  height: 16px;
  margin: 7px auto;
  background: #e7b99a;
  border: 3px solid #90665d;
}

/* 衣柜 */
.pixel-wardrobe {
  position: absolute;
  width: 74px;
  height: 100px;
  right: 12px;
  bottom: 16px;
  display: flex;
  background: #bc896e;
  border: 6px solid #805b52;
  box-shadow: 4px 4px 0 #674b46;
}

.wardrobe-door {
  flex: 1;
  border-right: 3px solid #805b52;
  position: relative;
}

.wardrobe-door:last-child {
  border-right: 0;
}

.wardrobe-door::after {
  content: "";
  position: absolute;
  right: 5px;
  top: 48%;
  width: 5px;
  height: 8px;
  background: #f4d6a2;
}

/* 小兔子装饰 */
.pixel-bunny {
  position: absolute;
  right: 100px;
  bottom: 16px;
  color: #d17c9a;
  font-size: 22px;
  font-weight: bold;
}

/* 手机适配 */
@media (max-width: 560px) {
  .pixel-bed {
    transform: translateX(-50%) scale(.72);
    transform-origin: top center;
  }

  .pixel-window,
  .pixel-nightstand,
  .pixel-wardrobe {
    zoom: .7;
  }

  .pixel-rug {
    transform: translateX(-50%) scale(.75);
  }
}
/* ===== PIXEL KITCHEN ===== */

.pixel-kitchen-counter {
  position: absolute;
  top: 48px;
  right: 14px;
  width: 68%;
  height: 70px;
  background: #e8b99f;
  border: 5px solid #986c64;
  box-shadow: 4px 4px 0 #7b5754;
}

.pixel-stove {
  position: absolute;
  top: 5px;
  left: 12px;
  width: 65px;
  height: 28px;
  background: #f8e9e3;
  border: 3px solid #b68c85;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.pixel-stove span {
  width: 15px;
  height: 15px;
  background: #777079;
  border: 4px solid #a8a0a3;
}

.pixel-sink {
  position: absolute;
  top: 5px;
  right: 15px;
  width: 55px;
  height: 28px;
  background: #c5e2e2;
  border: 5px solid #f9eee7;
  box-shadow: inset 0 0 0 3px #8bb8c1;
}

.counter-cabinets {
  position: absolute;
  left: 4px;
  right: 4px;
  bottom: 3px;
  height: 23px;
  display: flex;
}

.counter-cabinets span {
  flex: 1;
  border: 3px solid #b78478;
  background: #f4d5c2;
  position: relative;
}

.counter-cabinets span::after {
  content: "";
  position: absolute;
  width: 5px;
  height: 5px;
  top: 6px;
  right: 8px;
  background: #aa8174;
}

/* 粉色双开门冰箱 */
.pixel-fridge {
  position: absolute;
  width: 64px;
  height: 106px;
  left: 17px;
  bottom: 17px;
  background: linear-gradient(
    to bottom,
    #f7d9e2 0 55%,
    #b98694 55% 59%,
    #f1c3d1 59% 100%
  );
  border: 5px solid #a77a83;
  box-shadow: 4px 4px 0 #84616a;
}

.fridge-handle-top,
.fridge-handle-bottom {
  position: absolute;
  width: 5px;
  height: 18px;
  right: 9px;
  background: #fff7ed;
}

.fridge-handle-top { top: 16px; }
.fridge-handle-bottom { bottom: 14px; }

/* 餐桌 */
.pixel-dining-table {
  position: absolute;
  width: 120px;
  height: 76px;
  right: 35px;
  bottom: 24px;
  background: #dba98b;
  border: 7px solid #a77b69;
  box-shadow: 5px 5px 0 #846052;
}

.pixel-plate {
  position: absolute;
  width: 40px;
  height: 30px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  background: #fff9ee;
  border: 5px solid #e9c9b8;
}

.pixel-strawberry {
  position: absolute;
  width: 15px;
  height: 15px;
  top: 27px;
  left: 48px;
  background: #e66e80;
  box-shadow:
    5px 0 #e66e80,
    0 5px #e66e80,
    5px 5px #c95470,
    3px -5px #72a577;
}

/* 两把椅子 */
.pixel-kitchen-chair {
  position: absolute;
  width: 36px;
  height: 34px;
  background: #e9c4a9;
  border: 5px solid #a77b69;
  box-shadow: 3px 3px 0 #846052;
}

.chair-left {
  right: 165px;
  bottom: 44px;
}

.chair-right {
  right: 15px;
  bottom: 44px;
}

@media (max-width: 560px) {
  .pixel-kitchen-counter {
    width: 63%;
    height: 60px;
  }

  .pixel-stove {
    left: 3px;
    width: 35px;
  }

  .pixel-sink {
    right: 3px;
    width: 30px;
  }

  .pixel-fridge {
    transform: scale(.7);
    transform-origin: bottom left;
  }

  .pixel-dining-table {
    transform: scale(.7);
    transform-origin: bottom right;
    right: 15px;
  }

  .pixel-kitchen-chair {
    display: none;
  }
}
</style>
</head>
<body>
<h1>Our Tiny World</h1>
<p>♡ Jiwoo & Haram's Little Home ♡</p>
<div class="game">
  <div class="house">
    <section class="room bedroom">
  <span class="room-name">🥛 BEDROOM</span>

  <div class="pixel-window">
    <div class="window-glass"></div>
  </div>

  <div class="pixel-bed">
    <div class="bed-headboard"></div>
    <div class="bed-pillows">
      <span></span>
      <span></span>
    </div>
    <div class="bed-blanket"></div>
    <div class="bed-footboard"></div>
  </div>

  <div class="pixel-rug"></div>

  <div class="pixel-nightstand">
    <div class="nightstand-drawer"></div>
  </div>

  <div class="pixel-wardrobe">
    <div class="wardrobe-door"></div>
    <div class="wardrobe-door"></div>
  </div>

  <div class="pixel-bunny">♡</div>
</section>
    <section class="room kitchen">
  <span class="room-name">🥛 KITCHEN</span>

  <div class="pixel-kitchen-counter">
    <div class="pixel-stove">
      <span></span><span></span>
    </div>
    <div class="pixel-sink"></div>
    <div class="counter-cabinets">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="pixel-fridge">
    <div class="fridge-handle-top"></div>
    <div class="fridge-handle-bottom"></div>
  </div>

  <div class="pixel-dining-table">
    <div class="pixel-plate"></div>
    <div class="pixel-strawberry"></div>
  </div>

  <div class="pixel-kitchen-chair chair-left"></div>
  <div class="pixel-kitchen-chair chair-right"></div>
</section>
    <section class="room living">
      <span class="room-name">🥛 LIVING ROOM</span>
      <div class="rug"></div>
      <div class="furniture sofa">🛋️</div>
      <div class="furniture tv">📺</div>
    </section>
    <section class="room bathroom">
      <span class="room-name">🫧 BATHROOM</span>
      <div class="furniture bath">🛁</div>
      <div class="furniture sink">🪞</div>
      <div class="furniture laundry">🧺</div>
    </section>
  </div>
</div>
</body>
</html>
